name: APK bauen

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: APK bauen
        run: gradle assembleDebug

      - name: APK als Release veröffentlichen (direkt aufs Handy ladbar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Fokus.apk
          gh release create "v${{ github.run_number }}" Fokus.apk \
            --title "Fokus ${{ github.run_number }}" \
            --notes "Fokus.apk herunterladen und installieren."
