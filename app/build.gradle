plugins {
    id 'com.android.application'
}

android {
    namespace 'de.fokus.app'
    compileSdk 34

    defaultConfig {
        applicationId 'de.fokus.app'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '4.1'
    }

    signingConfigs {
        fokus {
            storeFile file('fokus.keystore')
            storePassword 'fokus123'
            keyAlias 'fokus'
            keyPassword 'fokus123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fokus
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
